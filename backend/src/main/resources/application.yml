spring:
  application:
    name: defectra-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qualityinspect}
    username: ${DB_USER:qualityinspect}
    password: ${DB_PASSWORD:qualityinspect}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 15MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:teamdefectra@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev_only_change_me_to_a_long_random_secret_32plus}
    access-minutes: ${APP_JWT_ACCESS_MINUTES:30}
    refresh-days: ${APP_JWT_REFRESH_DAYS:7}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    username: ${APP_BOOTSTRAP_USERNAME:qm.admin}
    password: ${APP_BOOTSTRAP_PASSWORD:}
    org: ${APP_BOOTSTRAP_ORG:demo-org}
  storage:
    dir: ${STORAGE_DIR:./storage}
    max-image-bytes: ${MAX_IMAGE_BYTES:10485760}
  ml:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 30000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://10.0.2.2:8080,http://localhost:8080}
  registration:
    otp-ttl-minutes: ${APP_REG_OTP_TTL_MINUTES:5}
    max-attempts: ${APP_REG_MAX_ATTEMPTS:5}
    # OTP is delivered by email only; set true only for local demos without SMTP
    dev-otp-in-response: ${APP_REG_DEV_OTP:false}
    email-enabled: ${APP_REG_EMAIL_ENABLED:true}
    mail-from: ${MAIL_USERNAME:teamdefectra@gmail.com}
    mail-from-name: Defectra AI Support Team
    support-email: ${APP_REG_SUPPORT_EMAIL:teamdefectra@gmail.com}

genai:
  provider: ${GENAI_PROVIDER:none}
  base-url: ${GENAI_BASE_URL:https://api.openai.com/v1}
  api-key: ${GENAI_API_KEY:}
  model: ${GENAI_MODEL:gpt-4o-mini}
  temperature: ${GENAI_TEMPERATURE:0.1}
  timeout-seconds: ${GENAI_TIMEOUT_SECONDS:45}

logging:
  level:
    root: INFO
    com.qualityinspect: INFO
  pattern:
    # never log credentials: tokens/passwords are excluded from all log statements by code review rules
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/qualityinspect_test}
    username: ${TEST_DB_USER:qualityinspect}
    password: ${TEST_DB_PASSWORD:qualityinspect}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: false
  mail:
    host: localhost

app:
  bootstrap:
    enabled: true
    password: "Test!qm12345"
  ml:
    url: ${TEST_ML_URL:http://localhost:8000}
  registration:
    dev-otp-in-response: true
    email-enabled: false
